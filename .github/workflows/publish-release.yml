name: Publish release
on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
  # Only pushes to master publish. Pull requests and manual runs build the same
  # installers and upload them as workflow artifacts, so a release can be tested
  # before it goes out to customers.
  pull_request:
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

env:
  ELECTRON_IS_DEV: 0
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release-mac:
    runs-on: macos-latest

    # macOS-only signing config. Kept out of the workflow-level env so the
    # Windows job cannot pick up CSC_LINK and sign with the p12 instead of
    # Azure Artifact Signing.
    env:
      CSC_LINK: ${{ secrets.CODE_SIGNING_CERTIFICATE }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      KEYCHAIN_PASS: ${{ secrets.KEYCHAIN_PASS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node environment
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
      - run: npm ci

      - name: Setup Certificates
        run: |
            echo $CSC_LINK | base64 --decode > certificate.p12
            security create-keychain -p $KEYCHAIN_PASS build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p $KEYCHAIN_PASS build.keychain
            security import certificate.p12 -k build.keychain -P $CSC_KEY_PASSWORD -T /usr/bin/codesign;
            security set-key-partition-list -S apple-tool:,apple: -s -k $KEYCHAIN_PASS build.keychain
            rm -rf *.p12

      - name: build (no publish)
        if: github.event_name != 'push'
        run: npm run build-mac

      - name: Upload mac installers
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: printdesk-mac
          path: |
            dist/*.dmg
            dist/*.zip

      - name: publish
        if: github.event_name == 'push'
        run: npm run publish-mac

      - name: Get release tag
        if: github.event_name == 'push'
        run: echo "GIT_TAG=v`$(echo node -p "require('./package.json').version")`" >> $GITHUB_ENV

      - name: Delete blockmap asset
        if: github.event_name == 'push'
        uses: mknejp/delete-release-assets@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ env.GIT_TAG }}
          assets: '*.zip.blockmap'

  release-win:
    # Must be a Windows runner: electron-builder drives Azure Artifact Signing
    # through the TrustedSigning PowerShell module, which it can only run on a
    # Windows host (on Linux it looks for a Parallels VM).
    runs-on: windows-latest

    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node environment
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
      - run: npm ci

      - name: build (no publish)
        if: github.event_name != 'push'
        run: npm run build-win

      - name: publish
        if: github.event_name == 'push'
        run: npm run publish-win

      # Fails the build if a signature is missing, untrusted or not
      # timestamped, so a broken signing setup can't reach a release. The
      # timestamp check is not optional: Azure Artifact Signing certificates
      # are only valid for a few days, so an untimestamped signature stops
      # validating almost immediately after release.
      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $signtool = Get-ChildItem -ErrorAction SilentlyContinue -Path `
            "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe", `
            "$env:LOCALAPPDATA\TrustedSigning\*\*\bin\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { throw "signtool.exe not found on this runner" }
          $targets = @(
            "dist\win-unpacked\Printdesk.exe",
            "dist\win-unpacked\resources\app.asar.unpacked\assets\BamdeskMint.exe"
          ) + (Get-ChildItem "dist\squirrel-windows\*.exe" | ForEach-Object FullName)
          foreach ($target in $targets) {
            Write-Host "::group::verify $target"
            $out = & $signtool.FullName verify /pa /v $target 2>&1
            $code = $LASTEXITCODE
            $out | Write-Host
            Write-Host "::endgroup::"
            if ($code -ne 0) { throw "signature verification failed: $target" }
            # -notmatch filters arrays instead of returning a boolean, so join first
            if (($out -join "`n") -notmatch 'The signature is timestamped') { throw "signature is not timestamped: $target" }
          }

      - name: Upload win installer
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: printdesk-win
          path: |
            dist/squirrel-windows/*.exe
            dist/squirrel-windows/*.nupkg
            dist/squirrel-windows/RELEASES
